name = "applyrn-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Poll every 2 minutes (PRD section 2.3). The scheduled handler fans out to
# enabled companies; per-company backoff lives in source_state.
[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "applyrn"
database_id = "420a52d5-4d18-4072-ba7a-70dbfb3c6d7d"
migrations_dir = "migrations"
