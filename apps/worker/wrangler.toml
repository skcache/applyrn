name = "applyrn-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Poll every minute; each invocation handles one company shard so the
# free-plan subrequest cap (50/invocation) is never exceeded at large
# watchlists. With 2 shards every company is still polled each 2 minutes.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "applyrn"
database_id = "420a52d5-4d18-4072-ba7a-70dbfb3c6d7d"
migrations_dir = "migrations"
