name = "applyrn-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Cron cadence retuned 2026-09-23 (Cloudflare request volume): 6 firings
# per hour, one every 10 minutes, instead of every minute. Each firing
# handles ONE company shard, so every company is polled once per
# CRON_INTERVAL_MINUTES x shardCount — 10 x 7 shards = 70 minutes at the
# current 226-company watchlist (was ~5 minutes); invocations drop
# 1440/day -> 144/day. Keep the 10-minute step in sync with
# CRON_INTERVAL_MINUTES in packages/domain/src/shard.ts — the shard rotation
# assumes exactly one firing per slot. The free-plan subrequest cap
# (50/invocation) still holds: a firing only ever covers one shard.
[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "applyrn"
database_id = "420a52d5-4d18-4072-ba7a-70dbfb3c6d7d"
migrations_dir = "migrations"
