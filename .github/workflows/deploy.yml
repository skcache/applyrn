name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

# Gated on Cloudflare credentials: when CLOUDFLARE_API_TOKEN / ACCOUNT_ID
# secrets are absent (e.g. public forks, pre-setup), the deploy steps skip.
# The owner enables deployment by setting those two secrets.
#
# Context rule: `secrets` is only available inside `env:` blocks, not in
# `if:` expressions. So secrets are copied into job-level env, and the
# steps gate on `env.*` (which IS valid in step `if:`).

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker + D1 migrations
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
    steps:
      - name: Deploy skipped (credentials not configured)
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: 'echo "Deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set."'

      - name: Deploy blocked (DASHBOARD_TOKEN not configured)
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' && env.DASHBOARD_TOKEN == '' }}
        run: |
          echo "::error::Deploy blocked: DASHBOARD_TOKEN secret is not set."
          echo "The worker API fails CLOSED without it, so deploying would lock out the dashboard."
          echo "Add a DASHBOARD_TOKEN secret to this repository (Settings > Secrets and variables > Actions)."
          exit 1

      - uses: actions/checkout@v4
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}

      - uses: pnpm/action-setup@v4
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply applyrn --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Deploy Worker
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        working-directory: apps/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Set Worker secrets
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        working-directory: apps/worker
        run: |
          echo "${{ secrets.TELEGRAM_BOT_TOKEN }}" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          echo "${{ secrets.TELEGRAM_CHAT_ID }}" | npx wrangler secret put TELEGRAM_CHAT_ID
          echo "${{ secrets.DASHBOARD_TOKEN }}" | npx wrangler secret put DASHBOARD_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
