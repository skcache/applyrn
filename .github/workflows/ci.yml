name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  boundary:
    name: Open-source boundary guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden files must never be tracked
        run: |
          FORBIDDEN=$(git ls-files | grep -E '(^|/)(\.env|\.dev\.vars)(\.|$)|\.env\.[^e]|\.sqlite$|\.db$|engineering-notebook\.html$|^docs/|production-dumps/' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "Forbidden tracked files found:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "Boundary guard passed"

      - name: No real-looking Telegram tokens in tracked files
        run: |
          LEAKS=$(git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{30,}' -- ':!pnpm-lock.yaml' || true)
          if [ -n "$LEAKS" ]; then
            echo "Possible Telegram bot token pattern found:"
            echo "$LEAKS"
            exit 1
          fi
          echo "Token pattern guard passed"
