name: Poll (redundant trigger)

# Cloudflare's free-plan cron triggers are known to silently stop
# dispatching (D-011: observed 19h40m dead window during V0 soak). This
# workflow is the belt-and-suspenders trigger: it POSTs /api/poll on a
# fixed schedule from GitHub Actions (unlimited on public repos), so the
# watchlist keeps being polled even when the platform cron goes quiet.
#
# Fallback semantics: each run first checks /api/status.lastPollAt. If a
# cycle completed recently (the primary Cloudflare cron is healthy), the
# run stands down. Only when cycles are stale does it poll the watchlist,
# so the two triggers never overlap and double-fire the same companies.
#
# Coverage math: the worker shards the watchlist (free-plan subrequest
# cap), so each /api/poll call covers one shard. The number of shards grows
# with the watchlist (guaranteed by the worker's shardCountFor: worst bucket
# <= 40 companies), so this workflow reads shardCount from /api/status and
# polls every shard — a fixed 0/1 pair would silently skip shards 2+ once
# the watchlist crosses ~80 companies.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-staleness:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
      shards: ${{ steps.check.outputs.shards }}
    steps:
      - name: Check whether the primary cron is still cycling
        id: check
        run: |
          STATUS=$(curl -fsS \
            -H "Authorization: Bearer ${{ secrets.DASHBOARD_TOKEN }}" \
            "https://applyrn-worker.siddhankuwar116.workers.dev/api/status")
          LAST=$(echo "$STATUS" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=JSON.parse(d).status; console.log(s.lastPollAt ?? "")})')
          SHARDS=$(echo "$STATUS" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{console.log(JSON.parse(d).status.shardCount ?? "1")})')
          NOW=$(date -u +%s)
          # Emit a JSON array of shard indices so the matrix job can poll every
          # shard without knowing the count in advance (watchlist-size dependent).
          SHARD_LIST=$(node -e 'const n=Number(process.argv[1]||"1");console.log(JSON.stringify(Array.from({length:n},(_,i)=>String(i))))' "$SHARDS")
          echo "shards=$SHARD_LIST" >> "$GITHUB_OUTPUT"
          if [ -z "$LAST" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            AGE=$((NOW - $(date -u -d "$LAST" +%s)))
            echo "last poll age: ${AGE}s; shards: ${SHARD_LIST}"
            if [ "$AGE" -gt 180 ]; then
              echo "stale=true" >> "$GITHUB_OUTPUT"
            else
              echo "stale=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  poll-shards:
    needs: check-staleness
    if: needs.check-staleness.outputs.stale == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.check-staleness.outputs.shards) }}
    steps:
      - name: Poll shard ${{ matrix.shard }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DASHBOARD_TOKEN }}" \
            "https://applyrn-worker.siddhankuwar116.workers.dev/api/poll?shard=${{ matrix.shard }}"
        timeout-minutes: 2

