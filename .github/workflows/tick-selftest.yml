name: Tick self-test (one-shot)

# Phase 2 verification: exercise POST /api/tick with the real DASHBOARD_TOKEN
# to prove the third trigger path works end-to-end in production. Two runs:
# 1. immediately after a healthy cron cycle -> expect {ticked:false} (stand-down)
# 2. (informational) the response shape for an external pinger
# This workflow is manual-only and safe to delete after verification.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/tick without token (expect 401)
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://applyrn-worker.siddhankuwar116.workers.dev/api/tick")
          echo "no-token status: $CODE"
          [ "$CODE" = "401" ]

      - name: Call /api/tick with token
        run: |
          RESP=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DASHBOARD_TOKEN }}" \
            "https://applyrn-worker.siddhankuwar116.workers.dev/api/tick")
          echo "tick response: $RESP"
