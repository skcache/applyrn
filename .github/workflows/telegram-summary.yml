name: Telegram summary (one-shot)

# Temporary: sends the security-audit summary to the user's Telegram via the
# same bot secrets deploy.yml uses. Removed immediately after sending.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send summary
        run: |
          TEXT="Hey! Security audit complete, heres the issues I fixed:
          x. Tick sweep budget bug (post-outage mass failures returning false success)
          y. Shard-count divergence (fallback triggers silently skipped whole buckets)
          z. Relevance crash + uncapped descriptions; chunked byte-cap bypass in all 6 adapters; retry-queue starvation + silent alert expiry; Workday URL origin-pinning; id-rotation spam cap; /api/poll stand-down gate; retention sweep + indexes; deploy.yml secret-handling.
          Everything is functional and operational!"
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$TEXT" > /dev/null && echo "sent"
